<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="description" content="An editorial collection of hair colour, cuts and texture from Amuse Hair Salon in Kuala Lumpur." />
    <title>Hair Gallery | Amuse Hair Salon Kuala Lumpur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand-logo" href="../index.html#top" aria-label="Amuse Hair Salon home"><img src="../amuse-logo.svg" alt="Amuse Hair Salon" /></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="../services/index.html">Services</a>
        <a href="../gallery/index.html">Gallery</a>
        <a href="../about/index.html">Our salon</a>
        <a href="../contact/index.html">Visit us</a>
      </nav>
      <a class="button button-small" href="https://wa.me/60166163818?text=Hi%20Amuse%20Hair%20Studio%2C%20I%E2%80%99d%20like%20to%20ask%20about%20your%20hair%20services" target="_blank" rel="noopener noreferrer">BOOK NOW <span aria-hidden="true">↗</span></a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button>
    </header>

    <main id="main" class="gallery-page">
      <header class="gallery-page-intro">
        <div class="gallery-page-title">
          <p class="eyebrow">Gallery</p>
          <h1>Hair, in focus.</h1>
        </div>
        <p class="gallery-page-note">Colour, cut, texture and styling.</p>
      </header>

      <div class="gallery-page-story">
        <section class="gallery-collection" aria-labelledby="gallery-colour-title">
          <header class="gallery-collection-heading">
            <p class="gallery-collection-number">01</p>
            <h2 id="gallery-colour-title">Colour</h2>
            <p class="gallery-scroll-hint">Scroll / swipe <span aria-hidden="true">→</span></p>
          </header>
          <div class="gallery-track gallery-track--colour" role="region" aria-label="Colour photographs" tabindex="0">
            <button class="gallery-photo gallery-photo--colour-lead" type="button" data-gallery-photo data-full="https://images.unsplash.com/photo-1687298668922-b4dd3653877d?auto=format&fit=crop&w=2200&q=90" aria-label="View portrait with vivid copper-red hair">
              <img src="https://images.unsplash.com/photo-1687298668922-b4dd3653877d?auto=format&fit=crop&w=1200&q=85" srcset="https://images.unsplash.com/photo-1687298668922-b4dd3653877d?auto=format&fit=crop&w=700&q=85 700w, https://images.unsplash.com/photo-1687298668922-b4dd3653877d?auto=format&fit=crop&w=1400&q=85 1400w" sizes="(max-width: 620px) 80vw, 660px" width="1200" height="1600" alt="Fashion portrait of a model with vivid copper-red hair." fetchpriority="high" decoding="async" />
            </button>
            <button class="gallery-photo gallery-photo--colour-blonde" type="button" data-gallery-photo data-full="https://images.unsplash.com/photo-1717765849801-4ebfc25db51e?auto=format&fit=crop&w=2200&q=90" aria-label="View portrait with blonde highlights">
              <img src="https://images.unsplash.com/photo-1717765849801-4ebfc25db51e?auto=format&fit=crop&w=900&q=85" srcset="https://images.unsplash.com/photo-1717765849801-4ebfc25db51e?auto=format&fit=crop&w=600&q=85 600w, https://images.unsplash.com/photo-1717765849801-4ebfc25db51e?auto=format&fit=crop&w=1000&q=85 1000w" sizes="(max-width: 620px) 62vw, 400px" width="1200" height="1800" alt="Editorial portrait with long blonde hair and bright highlights." loading="lazy" decoding="async" />
            </button>
            <button class="gallery-photo gallery-photo--colour-copper" type="button" data-gallery-photo data-full="https://images.unsplash.com/photo-1758798261207-7039105e8195?auto=format&fit=crop&w=2200&q=90" aria-label="View fashion portrait with long copper hair">
              <img src="https://images.unsplash.com/photo-1758798261207-7039105e8195?auto=format&fit=crop&w=1000&q=85" srcset="https://images.unsplash.com/photo-1758798261207-7039105e8195?auto=format&fit=crop&w=700&q=85 700w, https://images.unsplash.com/photo-1758798261207-7039105e8195?auto=format&fit=crop&w=1400&q=85 1400w" sizes="(max-width: 620px) 70vw, 480px" width="1200" height="1800" alt="Fashion portrait of a woman with long copper-red hair." loading="lazy" decoding="async" />
            </button>
          </div>
        </section>

        <section class="gallery-collection gallery-collection--cut" aria-labelledby="gallery-cut-title">
          <header class="gallery-collection-heading">
            <p class="gallery-collection-number">02</p>
            <h2 id="gallery-cut-title">Cut &amp; Styling</h2>
            <p class="gallery-scroll-hint">Scroll / swipe <span aria-hidden="true">→</span></p>
          </header>
          <div class="gallery-track gallery-track--cut" role="region" aria-label="Cut and styling photographs" tabindex="0">
            <button class="gallery-photo gallery-photo--cut-lead" type="button" data-gallery-photo data-full="https://images.unsplash.com/photo-1563179827-e31d4426fe1a?auto=format&fit=crop&w=2200&q=90" aria-label="View brunette hair styled in motion">
              <img src="https://images.unsplash.com/photo-1563179827-e31d4426fe1a?auto=format&fit=crop&w=1200&q=85" srcset="https://images.unsplash.com/photo-1563179827-e31d4426fe1a?auto=format&fit=crop&w=800&q=85 800w, https://images.unsplash.com/photo-1563179827-e31d4426fe1a?auto=format&fit=crop&w=1600&q=85 1600w" sizes="(max-width: 620px) 78vw, 620px" width="1200" height="1800" alt="Outdoor fashion portrait with long brunette hair caught in motion." loading="lazy" decoding="async" />
            </button>
            <button class="gallery-photo gallery-photo--cut-work" type="button" data-gallery-photo data-full="https://images.unsplash.com/photo-1774660810725-fb04e002003d?auto=format&fit=crop&w=2200&q=90" aria-label="View a stylist working with a client">
              <img src="https://images.unsplash.com/photo-1774660810725-fb04e002003d?auto=format&fit=crop&w=1200&q=85" srcset="https://images.unsplash.com/photo-1774660810725-fb04e002003d?auto=format&fit=crop&w=700&q=85 700w, https://images.unsplash.com/photo-1774660810725-fb04e002003d?auto=format&fit=crop&w=1400&q=85 1400w" sizes="(max-width: 620px) 66vw, 460px" width="1400" height="1000" alt="A hairstylist working with a client during a styling appointment." loading="lazy" decoding="async" />
            </button>
            <button class="gallery-photo gallery-photo--cut-profile" type="button" data-gallery-photo data-full="https://images.unsplash.com/photo-1770576568718-6747e3d85de8?auto=format&fit=crop&w=2200&q=90" aria-label="View a profile with softly waved hair">
              <img src="https://images.unsplash.com/photo-1770576568718-6747e3d85de8?auto=format&fit=crop&w=900&q=85" srcset="https://images.unsplash.com/photo-1770576568718-6747e3d85de8?auto=format&fit=crop&w=600&q=85 600w, https://images.unsplash.com/photo-1770576568718-6747e3d85de8?auto=format&fit=crop&w=1000&q=85 1000w" sizes="(max-width: 620px) 62vw, 410px" width="1200" height="1800" alt="Monochrome profile portrait with long, softly waved dark hair." loading="lazy" decoding="async" />
            </button>
          </div>
        </section>

        <section class="gallery-collection gallery-collection--texture" aria-labelledby="gallery-texture-title">
          <header class="gallery-collection-heading">
            <p class="gallery-collection-number">03</p>
            <h2 id="gallery-texture-title">Texture</h2>
            <p class="gallery-scroll-hint">Scroll / swipe <span aria-hidden="true">→</span></p>
          </header>
          <div class="gallery-track gallery-track--texture" role="region" aria-label="Texture photographs" tabindex="0">
            <button class="gallery-photo gallery-photo--texture-lead" type="button" data-gallery-photo data-full="https://images.unsplash.com/photo-1774379456542-28f9697809a4?auto=format&fit=crop&w=2200&q=90" aria-label="View fashion portrait with defined curls">
              <img src="https://images.unsplash.com/photo-1774379456542-28f9697809a4?auto=format&fit=crop&w=1200&q=85" srcset="https://images.unsplash.com/photo-1774379456542-28f9697809a4?auto=format&fit=crop&w=720&q=85 720w, https://images.unsplash.com/photo-1774379456542-28f9697809a4?auto=format&fit=crop&w=1400&q=85 1400w" sizes="(max-width: 620px) 78vw, 610px" width="1200" height="1600" alt="Fashion portrait of a model with naturally defined curls." loading="lazy" decoding="async" />
            </button>
            <button class="gallery-photo gallery-photo--texture-curls" type="button" data-gallery-photo data-full="https://images.unsplash.com/photo-1597373962453-3d82ed1df2a1?auto=format&fit=crop&w=2200&q=90" aria-label="View natural curls in a monochrome portrait">
              <img src="https://images.unsplash.com/photo-1597373962453-3d82ed1df2a1?auto=format&fit=crop&w=900&q=85" srcset="https://images.unsplash.com/photo-1597373962453-3d82ed1df2a1?auto=format&fit=crop&w=500&q=85 500w, https://images.unsplash.com/photo-1597373962453-3d82ed1df2a1?auto=format&fit=crop&w=900&q=85 900w" sizes="(max-width: 620px) 62vw, 400px" width="1200" height="1800" alt="Black-and-white fashion portrait with natural curls." loading="lazy" decoding="async" />
            </button>
          </div>
        </section>
      </div>
    </main>

    <dialog class="gallery-lightbox" aria-label="Gallery photo viewer">
      <button class="gallery-lightbox-close" type="button" aria-label="Close photo viewer" autofocus><span aria-hidden="true">×</span></button>
      <button class="gallery-lightbox-previous" type="button" aria-label="Previous photo"><span aria-hidden="true">←</span></button>
      <div class="gallery-lightbox-stage">
        <img class="gallery-lightbox-image" alt="" />
      </div>
      <button class="gallery-lightbox-next" type="button" aria-label="Next photo"><span aria-hidden="true">→</span></button>
      <p class="gallery-lightbox-count" aria-live="polite"></p>
    </dialog>

    <footer class="site-footer">
      <a class="brand-logo" href="../index.html#top" aria-label="Amuse Hair Salon home"><img src="../amuse-logo.svg" alt="Amuse Hair Salon" /></a>
      <span>© <span id="year">2026</span> Amuse Hair Salon · Kuala Lumpur</span>
    </footer>
    <script src="../script.js" defer></script>
    <script src="gallery.js" defer></script>
  </body>
</html>
